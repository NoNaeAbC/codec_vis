<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<dir>/share/fonts</dir>
	<cachedir>/var/cache/fontconfig</cachedir>
	<config>
		<rescan><int>0</int></rescan>
	</config>
	<alias>
		<family>sans</family>
		<prefer><family>sans-serif</family></prefer>
	</alias>
</fontconfig>
